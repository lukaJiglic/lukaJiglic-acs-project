name: train

# CPU-only tests of src/train (spec 003, criterion 9; spec 007, criterion 23;
# spec 006, criteria 20-22 and 27; spec 009, criteria 45, 52 and 53).
# The runner has no GPU: tests marked "gpu" are skipped by tests/conftest.py.
# The PyO3 probe is not built here: its tests skip themselves.
# The engine's Python module (src/train/tarok_env) is built here with maturin
# and its tests must run: TAROK_REQUIRE_ENV=1 turns a missing module into a failure.
# Tests marked "slow" (controls and second-network repeats, five tests) are
# left out here to keep the run short; they run by default on the training PC.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src/train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/train/requirements-ci.txt
      - name: Install CPU-only torch and the test dependencies
        run: python -m pip install -r requirements-ci.txt
      # The same compiler as the engine workflow. An unpinned runner brings
      # newer clippy lints.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.94.1
          cargo --version
      - name: Binding crate, format and clippy
        working-directory: src/train/tarok_env
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      # pip builds the wheel with maturin 1.16.0 (pinned in the crate's
      # pyproject.toml), in release mode, with the lock file as it is.
      - name: Build and install the tarok_env module
        run: python -m pip install ./tarok_env
      - name: pytest (GPU, PyO3 probe and slow tests left out)
        env:
          TAROK_REQUIRE_ENV: "1"
        run: python -m pytest -m "not slow"
