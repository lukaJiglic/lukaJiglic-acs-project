name: train

# CPU-only tests of src/train (spec 003, criterion 9; spec 007, criterion 23).
# The runner has no GPU: tests marked "gpu" are skipped by tests/conftest.py.
# The PyO3 probe is not built here: its tests skip themselves.
# Tests marked "slow" (controls and second-network repeats, five tests) are
# left out here to keep the run short; they run by default on the training PC.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src/train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/train/requirements-ci.txt
      - name: Install CPU-only torch and the test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: pytest (GPU, PyO3 and slow tests left out)
        run: python -m pytest -m "not slow"
